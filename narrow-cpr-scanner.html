<style>
  html, body { margin: 0; padding: 0; background: #0A0B12; scroll-behavior: smooth; overflow-x: hidden; max-width: 100%; }
  #root { min-height: 100vh; }
</style>
<style>
  /* Day/night theme toggle button + tab hover highlight (added on top of the app bundle) */
  .ncs-tab:hover:not(:disabled) {
    border-color: var(--indigo, #6366F1) !important;
    box-shadow: 0 0 0 3px rgba(99,102,241,.15);
  }
  .ncs-theme-toggle {
    width: 40px; height: 40px; min-width: 40px; min-height: 40px; max-width: 40px;
    border-radius: 50%;
    background: var(--panel-2, #181A28); border: 1px solid var(--border, #262A3D);
    color: var(--text, #E9EAF2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; flex-shrink: 0;
    transition: border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .ncs-theme-toggle:hover {
    border-color: var(--indigo, #6366F1);
    color: var(--indigo, #6366F1);
    box-shadow: 0 0 0 3px rgba(99,102,241,.18);
    transform: scale(1.06);
  }
  .ncs-theme-toggle-wrap { position: relative; display: flex; align-items: center; }
  .ncs-theme-tooltip {
    position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(-4px);
    background: linear-gradient(90deg, var(--indigo, #6366F1), var(--purple, #A855F7)); color: #fff;
    font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 7px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease; z-index: 10;
  }

  @media (max-width: 640px) {
    .ncs-theme-toggle { width: 36px; height: 36px; min-width: 36px; min-height: 36px; max-width: 36px; }
  }
  .ncs-hamburger {
    display: none; width: 34px; height: 34px; min-width: 34px; max-width: 34px; min-height: 34px; max-height: 34px; border-radius: 8px;
    border: 1px solid var(--border, #262A3D); background: var(--panel-2, #181A28); color: var(--text, #E9EAF2);
    align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .ncs-hamburger:hover { border-color: var(--indigo, #6366F1); color: var(--indigo, #6366F1); }
  @media (max-width: 900px) { .ncs-hamburger { display: flex; } }
  .ncs-site-nav { display: flex; align-items: center; gap: clamp(10px,1.6vw,20px); margin-left: clamp(10px,2vw,26px); }
  @media (min-width: 901px) { .ncs-header-fixed { justify-content: center; } }
  @media (max-width: 900px) { .ncs-theme-toggle-wrap { margin-left: auto !important; } }
  .ncs-site-nav a { font-size: clamp(11.5px,1vw,13px); font-weight: 600; color: var(--text-dim, #8B8FA8); white-space: nowrap; text-decoration: none; }
  .ncs-site-nav a:hover { color: var(--indigo, #6366F1); }
  .ncs-nav-dropdown { position: relative; }
  .ncs-nav-dropdown-btn {
    display: flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--text-dim, #8B8FA8); font-family: inherit; padding: 0;
  }
  .ncs-nav-dropdown-btn:hover { color: var(--indigo, #6366F1); }
  .ncs-nav-dropdown-btn svg { width: 12px; height: 12px; transition: transform .15s ease; }
  .ncs-nav-dropdown.open .ncs-nav-dropdown-btn svg { transform: rotate(180deg); }
  .ncs-nav-dropdown-menu {
    display: none; position: absolute; top: calc(100% + 14px); right: 0; min-width: 170px;
    background: var(--panel, #12141F); border: 1px solid var(--border, #262A3D); border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,.3); padding: 6px; z-index: 1001;
  }
  .ncs-nav-dropdown.open .ncs-nav-dropdown-menu { display: block; }
  .ncs-nav-dropdown-menu a {
    display: block; padding: 9px 12px; font-size: 13.5px; font-weight: 600; color: var(--text, #E9EAF2);
    border-radius: 6px; white-space: nowrap; text-decoration: none;
  }
  .ncs-nav-dropdown-menu a:hover { background: var(--panel-2, #181A28); color: var(--indigo, #6366F1); }
  .ncs-soon-link-nav { display: inline-flex; align-items: center; gap: 5px; opacity: .7; }
  @media (max-width: 900px) { .ncs-site-nav { display: none; } }
  .ncs-site-menu {
    display: none; flex-direction: column; position: fixed; left: 0; right: 0; top: 0; z-index: 999; background: var(--bg, #0A0B12);
    border-bottom: 1px solid var(--border, #262A3D); padding: 8px 24px 16px; max-height: 80vh; overflow-y: auto;
  }
  .ncs-site-menu.open { display: flex; }
  .ncs-site-menu a {
    padding: 13px 4px; font-size: 14.5px; font-weight: 600; color: var(--text, #E9EAF2);
    border-bottom: 1px solid var(--border, #262A3D); display: flex; align-items: center; gap: 8px; text-decoration: none;
  }
  .ncs-site-menu a:last-child { border-bottom: none; }
  .ncs-site-menu a:hover { color: var(--indigo, #6366F1); }
  .ncs-mobile-about-toggle { width: 100%; background: none; border: none; padding: 13px 4px; font-size: 14.5px; font-weight: 600; color: var(--text, #E9EAF2); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border, #262A3D); font-family: inherit; cursor: pointer; text-align: left; }
  .ncs-mobile-about-toggle svg { width: 14px; height: 14px; transition: transform .15s ease; flex-shrink: 0; }
  .ncs-mobile-about-toggle.open svg { transform: rotate(180deg); }
  .ncs-mobile-about-toggle:hover { color: var(--indigo, #6366F1); }
  .ncs-mobile-about-submenu { display: none; flex-direction: column; padding-left: 14px; }
  .ncs-mobile-about-submenu.open { display: flex; }
  .ncs-mobile-about-submenu a { padding: 12px 4px; font-size: 13.5px; font-weight: 600; color: var(--text-dim, #8B8FA8); border-bottom: 1px solid var(--border, #262A3D); }
  .ncs-mobile-about-submenu a:last-child { border-bottom: none; }
  .ncs-mobile-about-submenu a:hover { color: var(--indigo, #6366F1); }
  .ncs-soon-link { opacity: .7; }
  .ncs-soon-tag {
    font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    color: var(--indigo, #6366F1); background: rgba(99,102,241,.12); padding: 2px 6px; border-radius: 8px;
  }
</style>
</head>

  function positionMobileMenu(){

  function fixStickyHeader(){
    var header = findHeaderBar();
    if (!header) return;
    if (header.style.position !== 'fixed'){
      header.style.position = 'fixed';
      header.style.top = '0';
      header.style.left = '0';
      header.style.right = '0';
      header.style.zIndex = '1000';
      header.style.background = 'var(--bg)';
      header.style.transform = 'translateZ(0)';
      header.style.willChange = 'transform';
      header.style.backfaceVisibility = 'hidden';
      header.classList.add('ncs-header-fixed');
    }
    document.body.style.paddingTop = header.offsetHeight + 'px';
    // Keep our toggle button living inside the header row so it scrolls
    // (sticks) together with the brand bar instead of floating separately.
    if (toggleWrap && toggleWrap.parentElement !== header){
      header.appendChild(toggleWrap);
    }
    if (!hamburgerBtn){ hamburgerBtn = createHamburger(); }
    if (hamburgerBtn.parentElement !== header){ header.appendChild(hamburgerBtn); }
    if (!siteNav){ siteNav = createSiteNav(); }
    if (siteNav.parentElement !== header && header.children[1]){
      header.children[1].insertAdjacentElement('afterend', siteNav);
    }
    // Make the logo + brand text (header's first two children) navigate home.
    if (header.children[0] && !header.children[0].dataset.homeLink){
      header.children[0].style.cursor = 'pointer';
      header.children[0].dataset.homeLink = '1';
      header.children[0].addEventListener('click', function(){ window.location.href = '/'; });
    }
    if (header.children[1] && !header.children[1].dataset.homeLink){
      header.children[1].style.cursor = 'pointer';
      header.children[1].dataset.homeLink = '1';
      header.children[1].addEventListener('click', function(){ window.location.href = '/'; });
    }
    if (!mobileMenu){
      mobileMenu = createMobileMenu();
      header.insertAdjacentElement('afterend', mobileMenu);
    } else if (mobileMenu.previousElementSibling !== header){
      header.insertAdjacentElement('afterend', mobileMenu);
    }
  }

    Object.keys(vars).forEach(function(k){ document.documentElement.style.setProperty(k, vars[k]); });

  function ncsIntersect(){

      symbols = symbols.filter(function(s){ return Object.prototype.hasOwnProperty.call(other, s); });

  function ncsRenderComboCanvas(title, subtitle, columns, rows){
    var colDefs = [{label:ncsUnitLabel(), w:190, align:'left'},{label:'LTP', w:110, align:'right'}].concat(columns.map(function(c){return {label:c.label+' Width%', w:170, align:'right'};}));
    var totalW = colDefs.reduce(function(s,c){return s+c.w;},0);
    var pad = 40;
    var canvasW = totalW + pad*2;
    var headerH = 98, headRowH = 44, rowH = 44, footerH = 76;
    var canvasH = headerH + headRowH + rows.length*rowH + footerH + 16;
    var canvas = document.createElement('canvas');
    canvas.width = canvasW*2; canvas.height = canvasH*2;
    var ctx = canvas.getContext('2d');
    ctx.scale(2,2);
    ctx.fillStyle = '#F7F8FA'; ctx.fillRect(0,0,canvasW,canvasH);
    ctx.textBaseline = 'alphabetic';
    var grad = ctx.createLinearGradient(pad,0,pad+620,0);
    grad.addColorStop(0,'#6366F1'); grad.addColorStop(1,'#A855F7');
    ctx.fillStyle = grad;
    var fs=22; ctx.font = '700 '+fs+'px "Segoe UI", Arial, sans-serif';
    var maxTitleW = canvasW - pad - 280;
    while(ctx.measureText(title).width > maxTitleW && fs>14){fs--;ctx.font='700 '+fs+'px "Segoe UI", Arial, sans-serif';}
    ctx.textAlign = 'left';

      Daily: {candidates:0, included:0, cutByCap:0, dedupBy:{}}

        var claimedBy = used[sym];

        return;
      }
      used[sym] = tag;
      var entry = { symbol: sym, tag: tag, ltp: (row && typeof row.ltp === 'number') ? row.ltp : null, widthPct: (row && typeof row.widthPct === 'number') ? row.widthPct : null };
      if(rows.length < cap){ rows.push(entry); stats[tag].included++; }

      syms.forEach(function(sym){ considerSym(sym, tag, map[sym]); });

    var mwSyms = (monthlyMap && weeklyMap) ? ncsIntersect(monthlyMap, weeklyMap) : [];
    var wdSyms = (weeklyMap && dailyMap) ? ncsIntersect(weeklyMap, dailyMap) : [];
    var comboUniq = {};
    tripleSyms.concat(mwSyms, wdSyms).forEach(function(sym){ comboUniq[sym] = true; });

    for(var i=0;i<order.length;i++){
      var snap = avail[order[i]+'_snap'];
      if(snap && snap.nextDate) return snap.nextDate;
    }
    return null;
  }
  function ncsBuildMasterSection(avail, avail2, avail3){
    var wrap = document.createElement('div');
    wrap.className = 'ncs-combo-section';
    var dateLabel = ncsMasterDateLabel(avail);
    var masterTitle = 'Top Movers Master List' + (dateLabel ? ' for ' + dateLabel : '');
    var h = document.createElement('h4');
    h.textContent = masterTitle;
    wrap.appendChild(h);
    var note = document.createElement('p');
    note.className = 'ncs-combo-meta';
    note.textContent = 'One deduped list for the "Top Movers by VK" TradingView indicator. Fill order: Combo \u2192 Streaks \u2192 Monthly \u2192 Weekly \u2192 Daily (tightest width% first), capped below.';
    wrap.appendChild(note);
    var capRow = document.createElement('div');
    capRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:12px;';
    var capLabel = document.createElement('label');
    capLabel.textContent = 'Max symbols';
    capLabel.style.cssText = 'font-size:12.5px;font-weight:700;color:var(--text,#E9EAF2);';
    var capInput = document.createElement('input');
    capInput.type = 'number'; capInput.min = '1'; capInput.max = '40'; capInput.value = NCS_MASTER_CAP;
    capInput.style.cssText = 'width:60px;background:var(--panel,#12141F);border:1px solid var(--border,#262A3D);border-radius:6px;color:var(--text,#E9EAF2);font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;font-size:13px;padding:5px 8px;';
    var capBtn = document.createElement('button');
    capBtn.type = 'button'; capBtn.className = 'ncs-combo-export-btn'; capBtn.textContent = 'Update';
    capBtn.style.borderRadius = '6px'; capBtn.style.padding = '6px 14px'; capBtn.style.fontSize = '12px';
    capBtn.onclick = function(){
      var v = parseInt(capInput.value, 10);
      if(!isNaN(v) && v > 0){ NCS_MASTER_CAP = Math.min(v, 40); ncsOpenComboModal(); }
      else { capInput.value = NCS_MASTER_CAP; }
    };
    capRow.appendChild(capLabel); capRow.appendChild(capInput); capRow.appendChild(capBtn);
    wrap.appendChild(capRow);
    var built = ncsBuildMasterRows(avail, avail2, avail3, NCS_MASTER_CAP);
    var rows = built.rows, stats = built.stats;
    if(!rows.length){
      var p2 = document.createElement('p');
      p2.className = 'ncs-combo-empty';
      p2.textContent = 'Nothing to merge yet \u2014 save some Daily, Weekly or Monthly results to Combo first.';
      wrap.appendChild(p2);
      return wrap;
    }
    var tierColors = {Combo:'#A855F7', Streak:'#3B82F6', Mon:'#0F9D46', Week:'#1D8A34', Daily:'#8B8FA8'};
    var statsLine = document.createElement('div');
    statsLine.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;margin:-4px 0 12px;';
    ['Combo','Streak','Mon','Week','Daily'].forEach(function(tag){
      var st = stats[tag];
      var span = document.createElement('span');
      span.style.cssText = 'color:'+tierColors[tag]+';font-weight:700;';
      var parts = [];
      if(tag === 'Daily'){
        var missing = st.candidates - st.included;
        if(missing > 0) parts.push(missing + ' cut by cap');
      } else {
        Object.keys(st.dedupBy).forEach(function(byTag){
          parts.push(st.dedupBy[byTag] + ' cut by ' + byTag);
        });
        if(st.cutByCap > 0) parts.push(st.cutByCap + ' cut by cap');
      }
      var shortfall = parts.length ? ' (' + parts.join(', ') + ')' : '';
      span.textContent = tag + ': ' + st.included + '/' + st.candidates + shortfall;
      statsLine.appendChild(span);
    });
    wrap.appendChild(statsLine);
    var actionsRow = document.createElement('div');
    actionsRow.className = 'ncs-combo-actions';
    var countSpan = document.createElement('span');
    countSpan.className = 'ncs-combo-count';
    countSpan.textContent = rows.length + ' of ' + NCS_MASTER_CAP + ' slot' + (NCS_MASTER_CAP===1?'':'s') + ' filled';
    actionsRow.appendChild(countSpan);
    ncsAppendMasterExportButtons(actionsRow, rows, masterTitle, '', masterTitle);
    wrap.appendChild(actionsRow);
    ncsAppendMasterTable(wrap, rows);

    var leftover = built.leftover;
    var balanceWrap = document.createElement('div');
    balanceWrap.className = 'ncs-combo-section';
    var bh = document.createElement('h4');
    bh.textContent = 'Balance \u2014 Not in Top ' + NCS_MASTER_CAP + (dateLabel ? ' for ' + dateLabel : '');
    balanceWrap.appendChild(bh);
    var bnote = document.createElement('p');
    bnote.className = 'ncs-combo-meta';
    bnote.textContent = 'Every narrow-CPR candidate that was correctly deduped but missed the cap above \u2014 export this as a second TradingView watchlist to track separately.';
    balanceWrap.appendChild(bnote);
    if(!leftover.length){
      var bEmpty = document.createElement('p');
      bEmpty.className = 'ncs-combo-empty';
      bEmpty.textContent = 'Nothing left over \u2014 every deduped candidate fit inside the cap.';
      balanceWrap.appendChild(bEmpty);
    } else {
      var balActionsRow = document.createElement('div');
      balActionsRow.className = 'ncs-combo-actions';
      var balCountSpan = document.createElement('span');
      balCountSpan.className = 'ncs-combo-count';
      balCountSpan.textContent = leftover.length + ' ' + ncsUnitWord(leftover.length) + ' left out';
      balActionsRow.appendChild(balCountSpan);
      var balanceTitle = 'Balance \u2014 Not in Top ' + NCS_MASTER_CAP + (dateLabel ? ' for ' + dateLabel : '');
      ncsAppendMasterExportButtons(balActionsRow, leftover, balanceTitle, '', balanceTitle);
      balanceWrap.appendChild(balActionsRow);
      ncsAppendMasterTable(balanceWrap, leftover);
    }
    wrap.appendChild(balanceWrap);
    return wrap;
  }
  function ncsAppendMasterExportButtons(actionsRow, rows, titleStr, subStr, prefix){
    var btnGroup = document.createElement('div');
    btnGroup.className = 'ncs-combo-btn-group';
    var symbols = rows.map(function(r){ return r.symbol; });
    var pngBtn = document.createElement('button');
    pngBtn.type='button'; pngBtn.className='ncs-combo-export-btn'; pngBtn.textContent='PNG';
    pngBtn.onclick = function(){ ncsExportMasterPNG(titleStr, subStr, rows, prefix); };
    btnGroup.appendChild(pngBtn);
    var pdfBtn = document.createElement('button');
    pdfBtn.type='button'; pdfBtn.className='ncs-combo-export-btn'; pdfBtn.textContent='PDF';
    pdfBtn.onclick = function(){ ncsExportMasterPDF(titleStr, subStr, rows, prefix); };
    btnGroup.appendChild(pdfBtn);
    var tvBtn = document.createElement('button');
    tvBtn.type='button'; tvBtn.className='ncs-combo-export-btn'; tvBtn.textContent='TradingView';
    tvBtn.onclick = function(){ ncsExportTV(symbols, prefix); };
    btnGroup.appendChild(tvBtn);
    actionsRow.appendChild(btnGroup);
  }
  function ncsAppendMasterTable(wrap, rows){
    var table = document.createElement('table');
    table.className = 'ncs-combo-table';
    var thead = document.createElement('thead');
    var htr = document.createElement('tr');
    ['Symbol','Source','LTP','Width%'].forEach(function(lbl){
      var th = document.createElement('th'); th.textContent = lbl; th.style.cursor='default'; htr.appendChild(th);
    });
    thead.appendChild(htr); table.appendChild(thead);
    var tbody = document.createElement('tbody');
    var tagColors = {Combo:{bg:'rgba(168,85,247,0.18)',text:'#A855F7'}, Streak:{bg:'rgba(59,130,246,0.18)',text:'#3B82F6'}, Mon:{bg:'rgba(15,157,70,0.18)',text:'#0F9D46'}, Week:{bg:'rgba(55,204,81,0.18)',text:'#1D8A34'}, Daily:{bg:'rgba(91,97,120,0.18)',text:'#8B8FA8'}};
    rows.forEach(function(r){
      var tr = document.createElement('tr');
      var tdSym = document.createElement('td'); tdSym.textContent = r.symbol; tdSym.className='ncs-combo-sym'; tr.appendChild(tdSym);
      var tdTag = document.createElement('td');
      var badge = document.createElement('span'); badge.className='ncs-combo-width-badge';
      var tc = tagColors[r.tag] || tagColors.Daily;
      badge.style.background = tc.bg; badge.style.color = tc.text;
      badge.textContent = r.tag;
      tdTag.appendChild(badge); tr.appendChild(tdTag);
      var tdLtp = document.createElement('td'); tdLtp.className='ncs-combo-ltp';
      tdLtp.textContent = r.ltp!=null ? r.ltp.toFixed(2) : '\u2014';
      tr.appendChild(tdLtp);
      var tdW = document.createElement('td');
      if(r.widthPct!=null){
        var c = ncsBandColor(r.widthPct);
        var wb = document.createElement('span'); wb.className='ncs-combo-width-badge';
        wb.style.background = c.bg; wb.style.color = c.text;
        wb.textContent = r.widthPct.toFixed(2)+'%';
        tdW.appendChild(wb);
      } else { tdW.textContent = '\u2014'; }
      tr.appendChild(tdW);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }
  function ncsOpenComboModal(){
    var widthInput = document.getElementById('ncs-combo-width-input');
    var widthHint = document.getElementById('ncs-combo-width-hint');
    var widthUpdateBtn = document.getElementById('ncs-combo-width-update');
    if(widthInput){
      widthInput.value = NCS_COMBO_MAX_WIDTH;
      if(widthHint) widthHint.textContent = '(any '+ncsUnitWord(1)+' under this width%, regardless of band)';
      var applyWidth = function(){
        var v = parseFloat(widthInput.value);
        if(!isNaN(v) && v > 0){ NCS_COMBO_MAX_WIDTH = v; ncsOpenComboModal(); }
        else { widthInput.value = NCS_COMBO_MAX_WIDTH; }
      };
      if(widthUpdateBtn && !widthUpdateBtn._ncsWired){
        widthUpdateBtn._ncsWired = true;
        widthUpdateBtn.addEventListener('click', applyWidth);
      }
      if(!widthInput._ncsWired){
        widthInput._ncsWired = true;
        widthInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') applyWidth(); });
      }
    }
    var dailySnap = ncsReadSnap('daily'), weeklySnap = ncsReadSnap('weekly'), monthlySnap = ncsReadSnap('monthly');
    var dailyMap = ncsNarrowMap(dailySnap), weeklyMap = ncsNarrowMap(weeklySnap), monthlyMap = ncsNarrowMap(monthlySnap);
    var avail = {
      daily: Object.keys(dailyMap).length ? dailyMap : null, daily_snap: dailySnap,
      weekly: Object.keys(weeklyMap).length ? weeklyMap : null, weekly_snap: weeklySnap,
      monthly: Object.keys(monthlyMap).length ? monthlyMap : null, monthly_snap: monthlySnap
    };
    var body = document.getElementById('ncs-combo-body');
    body.innerHTML = '';
    function ncsTitleDate(keys){
      for(var i=0;i<keys.length;i++){
        var snap = avail[keys[i]+'_snap'];
        if(snap && snap.nextDate) return snap.nextDate;
      }
      return null;
    }
    function ncsTitled(base, keys){
      var d = ncsTitleDate(keys);
      return d ? base+' for '+d : base;
    }
    function ncsFileSafeDate(d){
      return d.replace(/\s+to\s+/g,'_to_').replace(/[^A-Za-z0-9_-]+/g,'-');
    }
    function ncsPrefixWithDate(base, keys){
      var d = ncsTitleDate(keys);
      return d ? base+'_for_'+ncsFileSafeDate(d) : base;
    }
    body.appendChild(ncsBuildSection(ncsTitled('Monthly + Weekly + Daily Triple Overlap', ['daily','weekly','monthly']), [{key:'monthly',label:'Monthly'},{key:'weekly',label:'Weekly'},{key:'daily',label:'Daily'}], avail, ncsPrefixWithDate('triple_combo', ['daily','weekly','monthly'])));
    body.appendChild(ncsBuildSection(ncsTitled('Monthly + Weekly Narrow CPR', ['weekly','monthly']), [{key:'monthly',label:'Monthly'},{key:'weekly',label:'Weekly'}], avail, ncsPrefixWithDate('monthly_weekly_combo', ['weekly','monthly'])));
    body.appendChild(ncsBuildSection(ncsTitled('Weekly + Daily Narrow CPR', ['daily','weekly']), [{key:'weekly',label:'Weekly'},{key:'daily',label:'Daily'}], avail, ncsPrefixWithDate('weekly_daily_combo', ['daily','weekly'])));

    var divider = document.createElement('div');
    divider.style.cssText = 'margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--border,#262A3D);';
    divider.innerHTML = '<span style="font-size:18px;font-weight:800;display:inline-block;background:linear-gradient(135deg,var(--indigo,#6366F1),var(--purple,#A855F7));-webkit-background-clip:text;background-clip:text;color:transparent;">Daily Narrow CPR Streaks</span>';
    body.appendChild(divider);
    var streakNote = document.createElement('p');
    streakNote.style.cssText = 'font-size:11.5px;color:var(--text-dim,#8B8FA8);margin:0 0 14px;';
    streakNote.textContent = 'Built from your last few Daily Save to Combo clicks — a ' + ncsUnitWord(1) + ' staying narrow for 2-3 days without breaking out can mean more pressure is building.';
    body.appendChild(streakNote);
    var histList = ncsReadDailyHistory();
    var historyLine = document.createElement('p');
    historyLine.style.cssText = 'font-size:11.5px;color:var(--text-dim,#8B8FA8);margin:-6px 0 14px;';
    if(histList.length === 0){
      historyLine.textContent = 'No Daily history saved yet. Click Save to Combo on the Daily tab to start building it (up to the last 5 days are kept).';
    } else {
      var dateStrs = histList.map(function(h){ return h.date || '?'; }).join(', ');
      historyLine.textContent = 'Currently storing ' + histList.length + ' day(s): ' + dateStrs + ' (up to 5 kept, oldest drops off automatically).';
    }
    body.appendChild(historyLine);

    var avail2 = ncsHistoryAvail(2);
    var streak2Date = avail2.h0_snap && avail2.h0_snap.nextDate ? avail2.h0_snap.nextDate : null;
    var streak2Title = '2-Day Narrow CPR Streak' + (streak2Date ? ' for ' + streak2Date : '');
    body.appendChild(ncsBuildSection(streak2Title, [{key:'h1',label:'Previous Save'},{key:'h0',label:'Latest Save'}], avail2, 'two_day_streak', streak2Title));
    var avail3 = ncsHistoryAvail(3);
    var streak3Date = avail3.h0_snap && avail3.h0_snap.nextDate ? avail3.h0_snap.nextDate : null;
    var streak3Title = '3-Day Narrow CPR Streak' + (streak3Date ? ' for ' + streak3Date : '');
    body.appendChild(ncsBuildSection(streak3Title, [{key:'h2',label:'2 Saves Ago'},{key:'h1',label:'Previous Save'},{key:'h0',label:'Latest Save'}], avail3, 'three_day_streak', streak3Title));

    var masterDivider = document.createElement('div');
    masterDivider.style.cssText = 'margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--border,#262A3D);';
    masterDivider.innerHTML = '<span style="font-size:18px;font-weight:800;display:inline-block;background:linear-gradient(135deg,var(--indigo,#6366F1),var(--purple,#A855F7));-webkit-background-clip:text;background-clip:text;color:transparent;">Top Movers Master List</span>';
    body.appendChild(masterDivider);
    body.appendChild(ncsBuildMasterSection(avail, avail2, avail3));

    document.getElementById('ncs-combo-overlay').style.display = 'flex';
  }
  function ncsCloseComboModal(){
    var ov = document.getElementById('ncs-combo-overlay');
    if(ov) ov.style.display = 'none';
  }
  function initComboWidget(){
    if(document.getElementById('ncs-combo-fab')) return;
    var style = document.createElement('style');
    style.textContent =
      '#ncs-combo-fab{position:fixed;right:20px;bottom:20px;z-index:2000;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--indigo,#6366F1),var(--purple,#A855F7));color:#fff;border:none;border-radius:999px;padding:12px 18px;font-family:"Segoe UI",Inter,Roboto,-apple-system,Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(99,102,241,.35);transition:transform .15s ease,box-shadow .15s ease;}' +
      '#ncs-combo-fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(99,102,241,.45);}' +
      '@media (max-width:640px){#ncs-combo-fab{right:14px;bottom:14px;padding:11px 14px;font-size:12.5px;}}' +
      '#ncs-combo-overlay{display:none;position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.55);align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;font-family:"Segoe UI",Inter,Roboto,-apple-system,Helvetica,Arial,sans-serif;}' +
      '#ncs-combo-panel{background:var(--panel,#12141F);border:1px solid var(--border,#262A3D);border-radius:16px;max-width:760px;width:100%;padding:26px;box-sizing:border-box;color:var(--text,#E9EAF2);}' +
      '#ncs-combo-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}' +
      '#ncs-combo-panel-head h3{font-size:18px;font-weight:800;margin:0;background:linear-gradient(135deg,var(--indigo,#6366F1),var(--purple,#A855F7));-webkit-background-clip:text;background-clip:text;color:transparent;}' +
      '#ncs-combo-close{background:none;border:none;color:var(--text-dim,#8B8FA8);font-size:22px;cursor:pointer;line-height:1;padding:4px;}' +
      '#ncs-combo-close:hover{color:var(--indigo,#6366F1);}' +
      '#ncs-combo-sub{font-size:12.5px;color:var(--text-dim,#8B8FA8);margin:0 0 12px;}' +
      '#ncs-combo-threshold{display:flex;align-items:center;gap:8px;margin:0 0 18px;padding:10px 12px;border:1px solid var(--border,#262A3D);border-radius:10px;background:var(--panel-2,#181A28);}' +
      '#ncs-combo-threshold label{font-size:12.5px;font-weight:700;color:var(--text,#E9EAF2);}' +
      '#ncs-combo-width-input{width:70px;background:var(--panel,#12141F);border:1px solid var(--border,#262A3D);border-radius:6px;color:var(--text,#E9EAF2);font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;font-size:13px;padding:5px 8px;}' +
      '#ncs-combo-width-input:focus{outline:none;border-color:var(--indigo,#6366F1);}' +
      '#ncs-combo-width-hint{font-size:11.5px;color:var(--text-dim,#8B8FA8);}' +
      '#ncs-combo-width-update{background:none;border:1px solid var(--indigo,#6366F1);color:var(--indigo,#6366F1);border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s ease,color .15s ease;}' +
      '#ncs-combo-width-update:hover{background:linear-gradient(135deg,var(--indigo,#6366F1),var(--purple,#A855F7));border-color:transparent;color:#fff;}' +
      '.ncs-combo-section{border:1px solid var(--border,#262A3D);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--panel-2,#181A28);}' +
      '.ncs-combo-section:last-child{margin-bottom:0;}' +
      '.ncs-combo-section h4{font-size:13.5px;font-weight:700;margin:0 0 6px;color:var(--text,#E9EAF2);}' +
      '.ncs-combo-meta{font-size:11.5px;color:var(--text-dim,#8B8FA8);margin-bottom:10px;}' +
      '.ncs-combo-empty{font-size:12.5px;color:var(--text-dim,#8B8FA8);margin:0;}' +
      '.ncs-combo-actions{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}' +
      '.ncs-combo-count{font-size:12px;font-weight:700;color:var(--indigo,#6366F1);}' +
      '.ncs-combo-btn-group{display:flex;gap:6px;flex-wrap:wrap;}' +
      '.ncs-combo-export-btn{background:none;border:1px solid var(--indigo,#6366F1);color:var(--indigo,#6366F1);border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s ease,color .15s ease;}' +
      '.ncs-combo-export-btn:hover{background:linear-gradient(135deg,var(--indigo,#6366F1),var(--purple,#A855F7));border-color:transparent;color:#fff;}' +
      '.ncs-combo-table{width:100%;border-collapse:collapse;font-size:12.5px;}' +
      '.ncs-combo-table th,.ncs-combo-table td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border,#262A3D);}' +
      '.ncs-combo-table th{color:var(--text-dim,#8B8FA8);font-weight:600;font-size:11.5px;cursor:pointer;user-select:none;white-space:nowrap;}' +
      '.ncs-combo-table th:hover{color:var(--indigo,#6366F1);}' +
      '.ncs-combo-width-badge{display:inline-block;font-weight:700;font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;font-size:12px;padding:3px 8px;border-radius:5px;}' +
      '.ncs-combo-ltp{font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;color:var(--text,#E9EAF2);}' +
      '.ncs-combo-sym{font-weight:700;font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;}';
    document.head.appendChild(style);

    var fab = document.createElement('button');
    fab.id = 'ncs-combo-fab'; fab.type = 'button';
    fab.textContent = '\u26A1 Combo';
    fab.onclick = ncsOpenComboModal;
    document.body.appendChild(fab);

    var overlay = document.createElement('div');
    overlay.id = 'ncs-combo-overlay';
    overlay.onclick = function(e){ if(e.target === overlay) ncsCloseComboModal(); };
    var panel = document.createElement('div');
    panel.id = 'ncs-combo-panel';
    panel.innerHTML =
      '<div id="ncs-combo-panel-head"><h3>Combo Narrow CPR</h3><button id="ncs-combo-close" type="button">&times;</button></div>' +
      '<p id="ncs-combo-sub">Stocks or Indices that are Narrow (or Too Narrow) CPR at the same time across timeframes \u2014 built from whatever you last clicked "Save to Combo" for on the Daily, Weekly and Monthly tabs.</p>' +
      '<div id="ncs-combo-threshold"><label for="ncs-combo-width-input">Width% under</label><input id="ncs-combo-width-input" type="number" step="0.01" min="0.01" /><button id="ncs-combo-width-update" type="button">Update</button><span id="ncs-combo-width-hint"></span></div>' +
      '<div id="ncs-combo-body"></div>';
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    document.getElementById('ncs-combo-close').onclick = ncsCloseComboModal;
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') ncsCloseComboModal(); });
  }

  function init(){
    var appRoot = findAppRoot();
    if (!appRoot){ setTimeout(init, 50); return; }
    applyTheme(current, appRoot);
    fixTwoColGrid();
    if (!toggleBtn){ toggleBtn = createToggle(); updateIcon(); }
    fixStickyHeader();
    initComboWidget();
    // React re-renders reset the wrapper's inline style to its hardcoded
    // dark-theme values; watch for that and immediately reapply our theme.
    var observer = new MutationObserver(function(){
      var liveEl = findAppRoot();
      if (!liveEl) return;
      var want = THEMES[current]['--bg'];
      var have = liveEl.style.getPropertyValue('--bg').trim();
      if (have !== want) applyTheme(current, liveEl);
      fixTwoColGrid();
      fixStickyHeader();
    });
    observer.observe(appRoot, { attributes: true, attributeFilter: ['style'], subtree: true });
    window.addEventListener('resize', function(){ fixTwoColGrid(); positionMobileMenu(); });
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
